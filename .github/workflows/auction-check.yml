# 开盘竞价复核（昨日选股）：每个交易日 09:21（北京时间）用集合竞价状态
# 复核昨晚的选股，给每只一个结论（值得入 / 谨慎减半 / 高开勿追 / 跳空走弱）。
# 集合竞价是 09:15–09:25，09:20 之后不能撤单、但仍可下买单，09:25 定开盘价，
# 09:30 开始连续竞价。所以本检查 09:21 触发，跑完提交约 09:23 能在页面上看到，
# 还剩约 2 分钟竞价时间可以下单（用限价单，开盘价冲出阈值时不成交）。
# 注意：结论按约 09:21 的竞价状态算，不是 09:25 的最终开盘价，
# 最后几分钟价格仍可能变动，脚本输出里有这句提醒。
#
# 只做规则判断，不跑 LLM。脚本 scripts/auction_check.py 只用标准库：
# 腾讯免费行情（竞价价/竞价量/昨收）+ 新浪免费日 K（5 日均量，算量比）。
# 为了快：不用 setup-python，直接用 runner 自带的 python3；步骤只有
# 检出、跑脚本、提交三步。
#
# 不用任何 Secret（选股来自仓库里的 docs/data/picks/，不用 LLM Key）。
# 跑完脚本后调 merge_data.py 把 auction 并进 latest.json，前端直接读。
name: 开盘竞价复核（昨日选股）

on:
  schedule:
    # 周一到周五 09:21 北京时间（集合竞价中段，结果约 09:23 可见）
    - cron: '21 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 每日 job 都往 main 分支提交数据，串行跑，避免 push 冲突
concurrency:
  group: quant-platform-data
  cancel-in-progress: false

jobs:
  auction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 今天（北京时间）
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 竞价复核（集合竞价状态 + 昨晚选股）
        # 脚本只用标准库，直接用 runner 自带的 python3，不装 setup-python，省时间
        run: python3 scripts/auction_check.py --date "${{ steps.date.outputs.date }}"

      - name: 合并前端数据
        run: python3 scripts/merge_data.py --date "${{ steps.date.outputs.date }}"

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "没有数据变化"; exit 0; fi
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git commit -m "data(auction): ${{ steps.date.outputs.date }} 竞价复核"
          git push origin "HEAD:${GITHUB_REF_NAME}" || { git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"; }
