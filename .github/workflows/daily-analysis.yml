# 每日分析（DSA）：工作日 18:00 分析自选股，写进 docs/data/。
#
# 上游做法的改动点（相对 ZhuLinsen/daily_stock_analysis 的 00-daily-analysis.yml）：
#   - 只传本平台要用的几个变量（STOCK_LIST、DEEPSEEK_API_KEY 等），
#     不传上游那几百个可选变量；尤其不传任何通知类变量；
#   - main.py 必须加 --no-notify（双保险：就算以后有人误配了通知变量也不推送）；
#   - 报告不只留 Artifacts，还要拷贝进 docs/data/reports/<日期>/ 供前端读。
#   - 模型：2026-11-27 由 Gemini 切到 DeepSeek（Gemini 免费版当天连失败 3 次，
#     503 过载 / 调用挂起超时）。上游文档：只填 DEEPSEEK_API_KEY 时默认用
#     deepseek-v4-flash；这里再显式指定渠道 + 模型，避免和残留的 Gemini 配置抢。
#
# 需要的 Secret：STOCK_LIST（必填，逗号分隔，如 002242,600519,000625）、
#   DEEPSEEK_API_KEY（必填，没有它分析跑不起来；platform.deepseek.com 创建，
#   注意 API 是预付费按量扣费，余额为 0 时调用报 402）。
# GEMINI_API_KEY 仍留在仓库 Secrets 里（选股工作流还在用），但本工作流不再传它。
# 绝不要加任何推送类 Secret。本平台没有推送。
name: 每日分析（DSA）

on:
  schedule:
    # 周一到周五 18:00 北京时间
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: quant-platform-data
  cancel-in-progress: false

env:
  DSA_SHA: 'a780a5b15d8d67639c9db61a4d7914166c34e9ab' # 见 config/upstream.json

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 检出上游 DSA（pin 的 SHA，不 Fork）
        uses: actions/checkout@v4
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: ${{ env.DSA_SHA }}
          path: vendor/dsa

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vendor/dsa/requirements.txt

      - name: 安装 DSA 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/dsa/requirements.txt

      - name: 今天（北京时间）
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 检查必填配置
        run: |
          if [ -z "${{ secrets.STOCK_LIST }}" ]; then
            echo "::error::没配 STOCK_LIST Secret。去 Settings → Secrets and variables → Actions 里加，值如 002242,600519,000625"
            exit 1
          fi
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "::error::没配 DEEPSEEK_API_KEY Secret。去 platform.deepseek.com 复制后贴到 Secrets 里（注意先充值，余额为 0 会报 402）"
            exit 1
          fi

      - name: 执行分析（不推送）
        working-directory: vendor/dsa
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_CHANNELS: 'deepseek'
          LITELLM_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek/deepseek-v4-flash' }}
          REPORT_TYPE: ${{ vars.REPORT_TYPE || 'simple' }}
          MARKET_REVIEW_ENABLED: 'true'
          MARKET_REVIEW_REGION: 'cn'
          LOG_LEVEL: INFO
          MAX_WORKERS: '1'
        run: |
          mkdir -p data logs reports
          # --no-notify 是硬要求：本平台没有任何推送。
          MODE="${{ inputs.mode || 'full' }}"
          FORCE_RUN_ARG=""
          if [ "${{ inputs.force_run }}" = "true" ]; then FORCE_RUN_ARG="--force-run"; fi
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review --no-notify $FORCE_RUN_ARG
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review --no-notify $FORCE_RUN_ARG
          else
            python main.py --no-notify $FORCE_RUN_ARG
          fi

      - name: 解析报告产物
        run: |
          python scripts/extract_dsa.py \
            --reports-dir vendor/dsa/reports \
            --out-dir "docs/data/reports/${{ steps.date.outputs.date }}" \
            --watchlist "${{ secrets.STOCK_LIST }}"

      - name: 合并前端数据
        run: python scripts/merge_data.py --date "${{ steps.date.outputs.date }}"

      - name: 上传原始报告（备用，30 天）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsa-reports-${{ github.run_number }}
          path: |
            vendor/dsa/reports/
            vendor/dsa/logs/
          retention-days: 30

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "没有数据变化"; exit 0; fi
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git commit -m "data(analysis): ${{ steps.date.outputs.date }} 研报更新"
          git push origin "HEAD:${GITHUB_REF_NAME}" || { git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"; }
