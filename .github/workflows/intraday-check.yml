# 尾盘检查（自选股）：每个交易日 14:30（北京时间）用盘中行情重算一次自选股，
# 在收盘前提醒该做什么。收盘是 15:00，14:57–15:00 是集合竞价（可下单不可撤单），
# 所以检查放在 14:30，留 30 分钟连续竞价时间操作。
#
# 只做规则提醒，不跑 LLM（DSA 的 AI 分析只在晚上 18:00 跑）。
# 脚本 scripts/intraday_check.py 只用标准库：腾讯免费行情 + 上次研报 dsa.json。
#
# 需要的 Secret：STOCK_LIST（自选股代码，逗号分隔）。
# 不用任何 LLM Key，不加推送类 Secret。
# 跑完脚本后调 merge_data.py 把 intraday 并进 latest.json，前端直接读。
name: 尾盘检查（自选股）

on:
  schedule:
    # 周一到周五 14:30 北京时间（收盘前 30 分钟）
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 每日 job 都往 main 分支提交数据，串行跑，避免 push 冲突
concurrency:
  group: quant-platform-data
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 今天（北京时间）
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 尾盘检查（盘中行情 + 上次研报）
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
        run: python scripts/intraday_check.py --date "${{ steps.date.outputs.date }}"

      - name: 合并前端数据
        run: python scripts/merge_data.py --date "${{ steps.date.outputs.date }}"

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "没有数据变化"; exit 0; fi
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git commit -m "data(intraday): ${{ steps.date.outputs.date }} 尾盘检查"
          git push origin "HEAD:${GITHUB_REF_NAME}" || { git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"; }
